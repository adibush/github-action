apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-node

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app-node

  template:
    metadata:
      labels:
        app: app-node

    spec:
      containers:
        - name: app-node
          image: adibush/app-node:830e29261a33d392a38e9be5f1e360bc8959b613
          imagePullPolicy: Always
          ports:
            - containerPort: 3000

apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-node

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app-node

  template:
    metadata:
      labels:
        app: app-node

    spec:
      containers:
        - name: app-node
          image: adibush/app-node:9484ba8273433bd661f838543ec5e81c795ac1d7
          imagePullPolicy: Always
          ports:
            - containerPort: 3000

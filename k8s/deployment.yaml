apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-node

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app-node

  template:
    metadata:
      labels:
        app: app-node

    spec:
      containers:
        - name: app-node
          image: adibush/app-node:7e71403be0e2b7a1a22a15e9b2cd2a05e689fdbd
          imagePullPolicy: Always
          ports:
            - containerPort: 3000

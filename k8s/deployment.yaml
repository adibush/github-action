apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-node

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app-node

  template:
    metadata:
      labels:
        app: app-node

    spec:
      containers:
        - name: app-node
          image: adibush/app-node:62704d8bd2e75b21aca0480d9e0b7350bdef4d19
          imagePullPolicy: Always
          ports:
            - containerPort: 3000

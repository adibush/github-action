apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-node

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app-node

  template:
    metadata:
      labels:
        app: app-node

    spec:
      containers:
        - name: app-node
          image: adibush/app-node:7b5b76fdd86f8dfa32716b52a1e17e01ec770a86
          imagePullPolicy: Always
          ports:
            - containerPort: 3000

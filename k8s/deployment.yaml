apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-node

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app-node

  template:
    metadata:
      labels:
        app: app-node

    spec:
      containers:
        - name: app-node
          image: adibush/app-node:4850bc1edec22aaae22b559b4415cbcacf5eaa88
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
